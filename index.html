<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Эпоха Петра I</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary: #2980b9;
            --success: #27ae60;
            --error: #c0392b;
            --border: #dcdde1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: var(--primary);
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-box {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .correct-answer-display {
            display: none;
            padding: 12px;
            background: #ffebee;
            color: var(--error);
            border-left: 5px solid var(--error);
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        input.input-correct {
            border-color: var(--success) !important;
            background-color: #e8f5e9;
            color: var(--success);
            font-weight: bold;
        }
        input.input-wrong {
            border-color: var(--error) !important;
            background-color: #ffebee;
            color: var(--error);
            font-weight: bold;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #2171a3;
        }
        .feedback {
            padding: 15px;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
        }
        .feedback.correct {
            display: block;
            background: #e8f5e9;
            color: var(--success);
            border: 1px solid #c8e6c9;
        }
        .feedback.wrong {
            display: block;
            background: #ffebee;
            color: var(--error);
            border: 1px solid #ffcdd2;
        }
        .hidden {
            display: none !important;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        .results-table th, .results-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }
        .results-table th {
            background: var(--bg-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Тренажер: Даты эпохи Петра I</h1>
    
    <div id="quiz-screen">
        <div class="stats">
            <span id="counter">Вопрос 1 из 32</span>
            <span id="score">Правильно: 0</span>
        </div>
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>
        
        <div id="question" class="question-box">Загрузка вопроса...</div>
        
        <!-- Новый блок для заметного вывода правильного ответа при ошибке -->
        <div id="correct-answer-box" class="correct-answer-display"></div>
        
        <div class="input-group">
            <input type="text" id="answer-input" placeholder="Введите год или диапазон (например, 1700 или 1700-1721)" autocomplete="off">
            <button id="action-btn" onclick="checkAnswer()">Ответить</button>
        </div>
        
        <div id="feedback" class="feedback"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Тестирование завершено!</h2>
        <p id="final-score" style="font-size: 18px; font-weight: bold;"></p>
        <button onclick="restartQuiz()">Пройти заново</button>
        
        <h3>Ваши ответы:</h3>
        <table class="results-table">
            <thead>
                <tr>
                    <th>Событие</th>
                    <th>Правильный ответ</th>
                    <th>Ваш ответ</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </div>
</div>

<script>
    const quizData = [
        { year: "1682", text: "Борьба за власть боярских группировок Нарышкиных и Милославских после смерти царя Федора Алексеевича. Стрелецкий бунт — «Хованщина»" },
        { year: "1682-1696", text: "Совместное правление Ивана V и Петра I при регентстве царевны Софьи Алексеевны до 1689" },
        { year: "1687", text: "Основание Славяно-греко-латинской академии в Москве" },
        { year: "1689", text: "Стрелецкое выступление, неудачная попытка свергнуть Петра I. Заточение Софьи Алексеевны в Новодевичий монастырь" },
        { year: "1696", text: "Смерть Ивана V" },
        { year: "1696-1725", text: "Единоличное правление Петра I" },
        { year: "1697-1698", text: "«Великое посольство» Петра в Европу" },
        { year: "1704", text: "Упразднение Боярской Думы" },
        { year: "1705", text: "Введение рекрутской повинности" },
        { year: "1708-1710", text: "Учреждение губерний в России" },
        { year: "1711", text: "Учреждение Правительствующего Сената" },
        { year: "1718", text: "Создание Тайной канцелярии" },
        { year: "1718-1721", text: "Учреждение коллегий" },
        { year: "1718-1724", text: "Проведение подушной переписи и первой ревизии" },
        { year: "1722", text: "Принятие «Табели о рангах»" },
        { year: "1700", text: "Константинопольский мирный договор с Турцией" },
        { year: "1700-1721", text: "Северная война России со Швецией" },
        { year: "1700", text: "Разгром русских войск под Нарвой" },
        { year: "1701", text: "Основание Школы математических и навигацких наук" },
        { year: "1702", text: "Взятие штурмом русскими войсками крепости Нотебург" },
        { year: "1703", text: "Взятие русскими войсками крепости Ниеншанц в устье Невы" },
        { year: "1703", text: "Основание Санкт-Петербурга" },
        { year: "1704", text: "Взятие русскими войсками крепостей Дерпт и Нарва" },
        { year: "1708", text: "Выступление гетмана Мазепы на стороне Швеции против России" },
        { year: "1708", text: "Битва при Лесной: разгром Петром I шведского корпуса генерала Левенгаупта (28 сентября)" },
        { year: "1709", text: "Полтавская битва: поражение шведских войск, бегство короля Карла XII и Мазепы в Турцию (27 июня)" },
        { year: "1711", text: "Прутский поход русских войск под командованием Петра I на территорию Турции. Окружение русской армии у Прута" },
        { year: "1711", text: "Заключение Прутского мирного договора. Возвращение Турции Азова, уничтожение крепостей на юге и флота на Азовском море" },
        { year: "1712", text: "Провозглашение Санкт-Петербурга столицей Российского государства" },
        { year: "1714", text: "Гангутское морское сражение. Победа русского флота" },
        { year: "1720", text: "Победа русского флота над шведской эскадрой у острова Гренгам" },
        { year: "1721", text: "Заключение Ништадтского мира России со Швецией (30 августа)" }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let userAnswers = [];
    let isAnswered = false;

    const questionEl = document.getElementById('question');
    const inputEl = document.getElementById('answer-input');
    const actionBtn = document.getElementById('action-btn');
    const feedbackEl = document.getElementById('feedback');
    const correctAnswerBox = document.getElementById('correct-answer-box');
    const counterEl = document.getElementById('counter');
    const scoreEl = document.getElementById('score');
    const progressEl = document.getElementById('progress');
    
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
        currentQuestions = shuffle([...quizData]);
        currentIndex = 0;
        correctCount = 0;
        userAnswers = [];
        isAnswered = false;
        
        quizScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        
        showQuestion();
    }

    function showQuestion() {
        isAnswered = false;
        inputEl.value = '';
        inputEl.disabled = false;
        inputEl.className = ''; // Сброс стилей рамки
        feedbackEl.style.display = 'none';
        correctAnswerBox.style.display = 'none'; // Прячем прошлую ошибку
        actionBtn.innerText = 'Ответить';
        
        const q = currentQuestions[currentIndex];
        questionEl.innerText = q.text;
        
        counterEl.innerText = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
        scoreEl.innerText = `Правильно: ${correctCount}`;
        progressEl.style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
        
        inputEl.focus();
    }

    function checkAnswer() {
        if (isAnswered) {
            nextQuestion();
            return;
        }

        const q = currentQuestions[currentIndex];
        const userAnswer = inputEl.value.trim().replace('—', '-').replace(/\s+/g, '');
        const correctAnswer = q.year.replace('—', '-').replace(/\s+/g, '');

        isAnswered = true;
        inputEl.disabled = true;

        let isCorrect = userAnswer === correctAnswer;
        
        userAnswers.push({
            text: q.text,
            correct: q.year,
            user: inputEl.value.trim() || "(пусто)",
            isCorrect: isCorrect
        });

        if (isCorrect) {
            correctCount++;
            inputEl.classList.add('input-correct');
            feedbackEl.className = "feedback correct";
            feedbackEl.innerText = "Правильно!";
        } else {
            inputEl.classList.add('input-wrong');
            feedbackEl.className = "feedback wrong";
            feedbackEl.innerText = `Неверно!`;
            
            // Крупно выводим правильный ответ под вопросом
            correctAnswerBox.innerText = `Правильный ответ: ${q.year}`;
            correctAnswerBox.style.display = 'block';
        }
        
        scoreEl.innerText = `Правильно: ${correctCount}`;
        actionBtn.innerText = 'Дальше';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        
        document.getElementById('final-score').innerText = `Ваш результат: ${correctCount} из ${currentQuestions.length} (${Math.round(correctCount/currentQuestions.length*100)}%)`;
        
        const tbody = document.getElementById('results-body');
        tbody.innerHTML = '';
        
        userAnswers.forEach(ans => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${ans.text}</td>
                <td style="color: var(--success); font-weight: bold;">${ans.correct}</td>
                <td style="color: ${ans.isCorrect ? 'var(--success)' : 'var(--error)'}; font-weight: bold;">${ans.user}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function restartQuiz() {
        startQuiz();
    }

    inputEl.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    startQuiz();
</script>

</body>
</html>
            window.location.href = `${basePath}sites/${siteName}_${version}.html`;
        }
        
        window.addEventListener('DOMContentLoaded', loadSite);
    </script>
</body>
</html>
